[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-md"
version = "1.0.0rc1"
description = "Stateful campaign workflow for ClayCode and LAMMPS GCMC-MD studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "numpy>=1.24",
  "pandas>=1.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mtagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
